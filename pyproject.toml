[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-kernel-runtime"
version = "3.0.0"
description = "Production-grade agentic runtime with ReAct loop, sandboxed tool execution, and persistent LLM memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
     "fastapi>=0.115,<1.0",
     "uvicorn[standard]>=0.30,<1.0",
     "pydantic>=2.8,<3.0",
     "sqlalchemy[asyncio]>=2.0",
     "aiosqlite>=0.19",
     "asyncpg>=0.29",
     "litellm>=1.48,<2.0",
     "redis>=5.0",
     "aiofiles>=23.2",
     "httpx>=0.27,<1.0",
     # Production additions
     "opentelemetry-api>=1.21.0",
     "opentelemetry-sdk>=1.21.0",
     "opentelemetry-instrumentation-fastapi>=0.42b0",
     "opentelemetry-instrumentation-sqlalchemy>=0.42b0",
     "opentelemetry-instrumentation-redis>=0.42b0",
     "opentelemetry-exporter-otlp>=1.21.0",
     "opentelemetry-propagators-b3>=1.21.0",
     "opentelemetry-propagator-jaeger>=1.21.0",
     "kubernetes-asyncio>=28.1.0",
     "structlog>=23.2.0",
     # Database migrations
     "alembic>=1.13",
 ]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
