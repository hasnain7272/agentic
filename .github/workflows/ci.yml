name: CI — Build & Smoke Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/vite-app

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/vite-app/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Production Build
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ui/vite-app/dist/
          retention-days: 7

  backend:
    name: Backend Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run Smoke Tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          HYBRID_MODE: "false"
          ALLOW_ANON_LOCAL: "true"
          JWT_SECRET: "ci-test-secret"
        run: python -m pytest tests/test_smoke.py -v --tb=short

  lint:
    name: File Size Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check Frontend File Sizes
        run: |
          echo "=== Frontend files exceeding 150 lines ==="
          find ui/vite-app/src -name "*.tsx" -o -name "*.ts" | while read f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 150 ]; then
              echo "WARNING: $f has $lines lines"
            fi
          done

      - name: Check Backend File Sizes
        run: |
          echo "=== Backend files exceeding 150 lines ==="
          find src -name "*.py" | while read f; do
            lines=$(wc -l < "$f")
            if [ "$lines" -gt 150 ]; then
              echo "WARNING: $f has $lines lines"
            fi
          done
